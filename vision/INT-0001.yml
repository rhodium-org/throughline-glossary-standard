uid: INT-0001
type: intent
status: proposed
title: Explain the concepts of graphs to the people who read them, and keep their
  names consistent
text: 'A graph that follows this standard is a glossary of the graphs it composes:
  each concept they use, held once, with its preferred name, a one-line definition,
  why it exists, what decides how it behaves and one concrete example, linked by
  stamped links to the items it was written from. Its audiences are its own items:
  a published glossary for one audience is the subset of terms marked for it, in
  that audience''s wording where the concept needs other words. Its terms map onto
  the terms of other glossaries it composes, so names that differ for one concept,
  names retired but still in use, and one name used for two concepts can be found
  and put right, and the vocabulary of many graphs converges over time.'
normative: false
