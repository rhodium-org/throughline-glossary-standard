[project]
name = "Glossary standard (throughline source)"
format_version = 4
suggested_namespace = "glossary"

# The meta-standard: the declaration kinds (REG, TYPE, ENUM, ATTR, LINK, LT, INT,
# GUIDE) and the base types every TYPE builds on.
# The standard this graph follows: its item types, attributes, links,
# statuses and rules are this graph's schema (SR-0275). Declare here only
# what this graph adds (SR-0276).
[[sources]]
namespace = "meta"
url = "https://github.com/rhodium-org/throughline-standard-standard"
ref = "v1.2.0"
schema = true

[grounding]
# A follower's one glossary is its root; every term reaches it.
root_types = ["intent", "glossary"]
delivery_roots = ["intent", "glossary"]
ai_origins = ["ai", "hybrid"]
