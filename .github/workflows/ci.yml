name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 5.2.0 checks a link declared to run outside the follower (throughline
      # SR-0320) and writes list attributes (SR-0321), which this standard uses.
      - run: pip install "throughline>=5.2.0"
      - name: The standard's graph is sound
        run: tl check
      - name: Every conformance example passes or fails as its EX item says
        run: bash conformance/check.sh
