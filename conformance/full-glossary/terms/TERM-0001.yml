attrs:
  why: So one deck can be shown to another organisation in that organisation's own
    look without its content being touched.
  how_it_works: The builder reads the brand's folder of tokens every time it makes
    a deck, and takes every colour, font, logo and slide style from it; the content
    names none of them.
  example: The November deck is made twice from the same content, once in the triad
    brand and once in the iddn brand.
